<footer class="bg-light dark:bg-darkmode-light">
  <div class="container">
    <div class="row items-end py-10">
      <div class="lg:col-3 mb-8 text-center lg:mb-0 lg:text-left">
        <!-- navbar brand/logo -->
        <a
          class="navbar-brand inline-block"
          href="{{ site.Home.RelPermalink }}">
          {{/* https://github.com/gethugothemes/hugo-modules/tree/master/images */}}
          {{ partial "logo" }}
        </a>
        <p class="text-text-light dark:text-darkmode-text-light mt-4">
          Copyright ©{{ now.Format "2006" }} {{ i18n "footer_copyright_name" }}
        </p>
      </div>
      <div
        class="lg:col-9 mb-8 text-center lg:mb-0 lg:mt-0 lg:text-right">
        <ul class="social-icons">
          {{ range site.Data.social.main }}
            <li>
              <a
                {{ if findRE `^http` .link }}
                  target="_blank" rel="nofollow noopener"
                {{ else }}
                  rel="nofollow"
                {{ end }}
                aria-label="{{ .name }}"
                href="{{ .link | safeURL }}">
                <i class="{{ .icon }}"></i>
              </a>
            </li>
          {{ end }}
        </ul>
      </div>
    </div>
  </div>
  <div class="border-border dark:border-darkmode-border border-t py-7">
    <div
      class="text-text-light dark:text-darkmode-text-light container text-center">
      <p>
        {{ i18n "footer_legal_line" | markdownify }}
      </p>
    </div>
  </div>
</footer>
