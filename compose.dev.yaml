services:
  web:
    image: nginx:1.29-alpine
    entrypoint:
      - nginx
      - -g
      - daemon off;
    ports:
      - "8080:80"
    restart: unless-stopped
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site/static/index.html:/srv/gateway/index.html:ro
      - ./site/static:/usr/share/nginx/html:ro
