server {
    listen 80;
    server_name _;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        root /srv/gateway;
        try_files /index.html =404;
    }

    location ~ ^(.+\.html)/$ {
        try_files $1/index.html =404;
    }

    location ~ \.html$ {
        try_files $uri/index.html =404;
    }

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }
}
